<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap — you showed up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#1E5B3F}a:hover{color:#13201A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ever}}; color: {{c.onEver}}; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 12px 0 24px">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="8">
        <div style="height: 3px; border-radius: 999px; {{s.style}}"></div>
      </sc-for>
    </div>
    <button aria-label="Close recap" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: {{c.onEver}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 32px 24px 0 24px">
    <div style="font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.02em">Winter Arc</div>
    <div style="font-size: 12px; line-height: 16px">1 Dec – 28 Feb · 90 days</div>
  </div>

  <div aria-hidden="true" style="display: flex; gap: 16px; padding: 40px 24px 0 24px; color: {{c.onEver}}">
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 20 L20 0 A20 20 0 0 1 40 20 Z" fill="currentColor"></path></svg>
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 20 L20 0 A20 20 0 0 1 20 40 Z" fill="currentColor"></path></svg>
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 20 L20 0 A20 20 0 1 1 0 20 Z" fill="currentColor"></path></svg>
    <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="currentColor"></circle></svg>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 56px 24px">
    <div style="font-size: 28px; line-height: 34px; font-weight: 650; letter-spacing: -0.01em">You showed up</div>
    <div style="font-size: 168px; line-height: 0.9; font-weight: 700; letter-spacing: -0.045em; margin: 8px 0 0 -6px">72</div>
    <div style="font-size: 28px; line-height: 34px; font-weight: 650; letter-spacing: -0.01em; margin-top: 8px">of 84 days</div>
    <div style="font-size: 12px; line-height: 16px; margin-top: 16px">Rest days aren't counted. They're not misses.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { frost: '#F3F5F0', surface: '#FFFFFF', sunken: '#E7ECE4', line: '#CBD3C6', lineStrong: '#7A877E', ink: '#13201A', muted: '#526158', ever: '#1E5B3F', everSoft: '#D8E9DE', onEver: '#FFFFFF', larch: '#8F5C08', larchSoft: '#F6E7C8', missed: '#A2482D', rest: '#3F6683' },
      dark:  { frost: '#0F1612', surface: '#17201B', sunken: '#1F2A24', line: '#34433A', lineStrong: '#6E7E74', ink: '#E6EDE7', muted: '#9DAAA1', ever: '#74C597', everSoft: '#1C3628', onEver: '#0F1612', larch: '#E6AA4E', larchSoft: '#3B2C13', missed: '#E39176', rest: '#93B7D0' }
    };
    const c = (this.props.dark ?? false) ? P.dark : P.light;
    const current = 0;
    const segs = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({
      style: 'background: ' + c.onEver + '; opacity: ' + (i <= current ? '1' : '0.35')
    }));
    return { c, segs };
  }
}
</script>
</body>
</html>
