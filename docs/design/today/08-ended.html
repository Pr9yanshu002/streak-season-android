<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — arc ended</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#74C597}a:hover{color:#E6EDE7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 24px 24px 40px 24px; background: {{c.frost}}; color: {{c.ink}}; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif">
  <div>
    <div style="font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.02em">Winter Arc</div>
    <div style="font-size: 12px; line-height: 16px; color: {{c.muted}}">Ended Saturday 28 February</div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 48px">
    <div>
      <div style="font-size: 28px; line-height: 34px; font-weight: 650; letter-spacing: -0.01em">Ninety days, done.</div>
      <div style="font-size: 28px; line-height: 34px; font-weight: 650; letter-spacing: -0.01em">You showed up</div>
      <div style="font-size: 96px; line-height: 0.9; font-weight: 700; letter-spacing: -0.045em; color: {{c.ever}}; margin-top: 12px">72</div>
      <div style="font-size: 20px; line-height: 26px; font-weight: 600; margin-top: 8px">of 84 days</div>
    </div>
    <div role="img" aria-label="All 90 days of Winter Arc, one row per week." style="display: grid; grid-template-columns: repeat(7, 12px); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="91">
        <div style="width: 12px; height: 12px; border-radius: 999px; box-sizing: border-box; {{d.style}}"></div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px">
    <div style="font-size: 16px; line-height: 24px; color: {{c.muted}}; margin-bottom: 20px">Your recap is ready — the whole season, and what you wrote along the way.</div>
    <button style="height: 56px; border: 0; border-radius: 999px; background: {{c.ever}}; color: {{c.onEver}}; font-family: inherit; font-size: 16px; line-height: 24px; font-weight: 600; cursor: pointer">See your recap</button>
    <button style="height: 56px; border-radius: 999px; background: transparent; color: {{c.ink}}; border: 1.5px solid {{c.lineStrong}}; font-family: inherit; font-size: 16px; line-height: 24px; font-weight: 600; cursor: pointer">Start something new</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { frost: '#F3F5F0', surface: '#FFFFFF', sunken: '#E7ECE4', line: '#CBD3C6', lineStrong: '#7A877E', ink: '#13201A', muted: '#526158', ever: '#1E5B3F', everSoft: '#D8E9DE', onEver: '#FFFFFF', larch: '#8F5C08', larchSoft: '#F6E7C8', missed: '#A2482D', rest: '#3F6683' },
      dark:  { frost: '#0F1612', surface: '#17201B', sunken: '#1F2A24', line: '#34433A', lineStrong: '#6E7E74', ink: '#E6EDE7', muted: '#9DAAA1', ever: '#74C597', everSoft: '#1C3628', onEver: '#0F1612', larch: '#E6AA4E', larchSoft: '#3B2C13', missed: '#E39176', rest: '#93B7D0' }
    };
    const c = (this.props.dark ?? true) ? P.dark : P.light;
    const disc = (s) => {
      if (s === 'C') return 'background: ' + c.ever;
      if (s === 'P') return 'background: linear-gradient(to top, ' + c.larch + ' 50%, ' + c.larchSoft + ' 50%)';
      if (s === 'M') return 'background: transparent; box-shadow: inset 0 0 0 1.5px ' + c.missed;
      if (s === 'R') return 'background: radial-gradient(circle, ' + c.rest + ' 0 30%, ' + c.sunken + ' 34%)';
      if (s === 'X') return 'visibility: hidden';
      return 'background: ' + c.sunken;
    };
    const season = 'CCCCCCRCCPCCCRCCCMCCCCMCRMCPCCCMCCRCCCPCCCCMCCCCCCCCRCCCCCCCCCCCCCCPCCCMCCCCRCCCMCCCCCPCCC' + 'X';
    const days = season.split('').map((s) => ({ style: disc(s) }));
    return { c, days };
  }
}
</script>
</body>
</html>
