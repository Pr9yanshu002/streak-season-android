name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run still going for the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Domain tests (contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :domain:test
      - name: Upload report if fixtures failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-report
          path: domain/build/reports/tests/test/

  app:
    name: App unit tests
    needs: domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest
      - name: Upload report if tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  build:
    name: Debug APK
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14